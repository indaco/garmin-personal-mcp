# sley configuration file
# Documentation: https://github.com/indaco/sley

# Enabled plugins:
#   - commit-parser
#   - tag-manager
#   - dependency-check
#   - changelog-generator

path: .version
plugins:
  # Analyzes conventional commits to suggest version bumps
  commit-parser: true
  # Automatically creates git tags after version changes
  tag-manager:
    enabled: true
  # Generates changelogs from git commits
  changelog-generator:
    enabled: true
    repository:
      auto-detect: true
    use-default-icons: true
    contributors:
      enabled: true
      show-name: false
  # Syncs version to package.json and other dependency files
  dependency-check:
    enabled: true
    auto-sync: true
    files:
      - path: package.json
        field: version
        format: json
