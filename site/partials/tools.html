<section class="block" id="tools" aria-labelledby="tools-h">
  <div class="wrap bands">
    <div class="grid">
      <div class="head">
        <h2 id="tools-h">{{toolCount}} tools, all of the Personal API.</h2>
        <p>
          Each tool returns JSON to your assistant. <code>garminGet</code> reads the endpoints that
          have no tool of their own.
        </p>
      </div>
      <div class="tools">{{tools}}</div>
      <p class="tools-note">
        <a href="https://github.com/indaco/garmin-personal-mcp/blob/main/guide/tools.md"
          >The tools guide</a
        >
        gives the endpoints, the details of each tool and the data that the Personal API does not
        have.
      </p>
    </div>
  </div>
</section>
