version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # a new release waits a week, so a compromised one is found and pulled first
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "deps"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  # the project uses the latest version of each dependency
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "deps"
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3
