name: Release

# Release steps: CONTRIBUTING.md. A push of a tag vX.Y.Z starts this workflow.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Cheap gate: a wrong tag stops here, before anything is published.
  tag-validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # full history with all branches, so that origin/main exists
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag shape, versions, changelog and branch
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          expected="${TAG_NAME#v}"

          # the v* trigger also matches "vfoo"
          case "$TAG_NAME" in
            *-* | *+*) fail "tag '$TAG_NAME' is a prerelease; the workflow publishes only vX.Y.Z as latest" ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) fail "tag '$TAG_NAME' is not vX.Y.Z" ;;
          esac

          version_file="$(tr -d '[:space:]' <.version)"
          if [ "$version_file" != "$expected" ]; then
            fail ".version is '$version_file' but tag is '$TAG_NAME' (expected '$expected'). Run 'sley bump' before tagging."
          fi

          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$pkg_version" != "$expected" ]; then
            fail "package.json version is '$pkg_version' but tag is '$TAG_NAME' (expected '$expected'). Run 'sley bump' before tagging."
          fi

          notes=".changes/${TAG_NAME}.md"
          if [ ! -s "$notes" ]; then
            fail "missing or empty changelog at $notes. Run 'sley changelog merge' before tagging."
          fi

          # the tagged commit must be on main (an exact check, not a branch-name match)
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            fail "tag '$TAG_NAME' points to a commit that is not on main. Refusing to release."
          fi

          echo "tag $TAG_NAME passed all checks"

  # Builds and checks the package. It has no id-token, so it cannot publish.
  build:
    name: Build package
    needs: tag-validate
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      # a release builds from scratch: no cache in a job of the release
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      # the page job of ci.yml, then the package; the check job has the rest of ci.yml
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # the site tests load the built website
      - name: Build the website
        run: pnpm build:site

      - name: Third-party notices are up to date
        run: git diff --exit-code THIRD-PARTY-NOTICES.md

      # the page tests load the built template; no browser cache in a release
      - name: Install the Chromium headless shell
        run: pnpm exec playwright-core install --only-shell chromium

      # all the page tests of ci.yml, the website included: a red CI must not publish
      - name: Page tests
        run: pnpm test:page

      - name: Package contents
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const allowed = ["README.md", "LICENSE", "THIRD-PARTY-NOTICES.md", "package.json"];
            const extra = files.filter((p) => !/^(dist|prompts)\//.test(p) && !allowed.includes(p));
            if (extra.length) { console.error("unexpected files in the package:", extra); process.exit(1); }
            if (!files.includes("dist/dashboard.html")) { console.error("the dashboard template is missing"); process.exit(1); }
            console.log(`${files.length} files in the package`);
          '

      - name: Pack
        id: pack
        # npm pack does not create the destination folder
        run: |
          mkdir -p out
          npm pack --pack-destination out
          echo "sha256=$(sha256sum out/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The check job of ci.yml, without the Codecov upload. Keep the two in step.
  check:
    name: Check (Node ${{ matrix.node }})
    needs: tag-validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # a release builds from scratch: no cache in a job of the release
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        if: matrix.node != 26
        run: pnpm test

      # the coverage floor also stops a release
      - name: Test with coverage
        if: matrix.node == 26
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # stdout carries MCP messages only: one initialize request, one JSON line back
      - name: Smoke test
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 10 node dist/index.js)
          test "$(printf '%s\n' "$out" | wc -l)" -eq 1
          printf '%s' "$out" | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'

  # The os job of ci.yml: the built commands on each system. A published version cannot be replaced.
  # Keep the two in step.
  os:
    name: ${{ matrix.os }} (Node ${{ matrix.node }})
    needs: tag-validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is the newest LTS. Here the latest images are the point: the commands must
        # work on the systems that users have now
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # a release builds from scratch: no cache in a job of the release
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # the check job has the tests on Linux
      - name: Test
        if: runner.os != 'Linux'
        run: pnpm test

      - name: Build
        run: pnpm build

      # not a dev dependency: it has a native part, and only this job needs it. An exact version,
      # because its install script runs on each CI and release run
      - name: Install node-pty
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/pty" --no-audit --no-fund node-pty@1.1.0

      # node-pty 1.1.0 installs this file without the execute bit: posix_spawnp failed.
      # find does not fail when a later version has no such file
      - name: Make the helper of node-pty executable
        if: runner.os == 'macOS'
        run: find "$RUNNER_TEMP/pty/node_modules/node-pty" -name spawn-helper -exec chmod +x {} +

      - name: End-to-end test
        shell: bash
        # E2E_SECOND_USER makes a local account on Windows: a runner is thrown away after the job
        run: E2E_SECOND_USER=1 E2E_PTY="$RUNNER_TEMP/pty/node_modules/node-pty" pnpm test:e2e

  # After every job of ci.yml passes. It can publish, so it runs no third-party action, no dependency install and no repo script.
  publish:
    name: Publish to npm
    needs: [build, check, os]
    runs-on: ubuntu-24.04
    environment:
      name: Release
    permissions:
      id-token: write # npm trusted publishing (OIDC); no npm token anywhere
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: out

      # 0.1.0 is published by hand, and a re-run must not fail on a published version
      - name: Check whether this version is on npm
        id: exists
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if npm view "@indaco/garmin-personal-mcp@${TAG_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # trusted publishing needs npm 11.5.1 or newer; Node 26 ships a newer npm, so nothing is installed
      - name: Check the npm version
        if: steps.exists.outputs.published != 'true'
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1) }' "$(npm --version)"

      - name: Publish
        if: steps.exists.outputs.published != 'true'
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one tarball, got ${#files[@]}"; exit 1; }
          # another job of this run runs third-party code: publish only the tarball of the build job
          echo "${SHA256:?}  ${files[0]}" | sha256sum -c -
          # without ./ npm reads out/<name>.tgz as a GitHub user/repo
          npm publish "./${files[0]}" --access public

  release-notes:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: Release
    permissions:
      contents: write # creates or edits the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=".changes/${TAG_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::missing or empty changelog at $notes"
            exit 1
          fi
          # edit when the release exists, so that a re-run is safe; only a new release becomes Latest
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file "$notes"
          else
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --latest --notes-file "$notes"
          fi

  # Last check: install the published version the way a user does.
  install-smoke:
    name: Install smoke test
    needs: release-notes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install and start the published package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          pkg="@indaco/garmin-personal-mcp@${version}"

          # npm says "may take a few minutes": v0.7.0 needed more than 5. Wait up to 15.
          for i in $(seq 1 90); do
            if [ "$(npm view "$pkg" version 2>/dev/null || true)" = "$version" ]; then break; fi
            if [ "$i" -eq 90 ]; then echo "::error::$pkg is not on the registry after 15 minutes"; exit 1; fi
            sleep 10
          done

          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 60 npx -y "$pkg")
          test "$(printf '%s\n' "$out" | wc -l)" -eq 1
          printf '%s' "$out" | VERSION="$version" node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const s = r.result.serverInfo;
            if (s.name !== "garmin-personal" || s.version !== process.env.VERSION) {
              console.error("unexpected serverInfo:", s);
              process.exit(1);
            }
          '
