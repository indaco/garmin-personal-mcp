<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="garmin-template" content="4" />
    <title>Training + Recovery</title>
    <script>
      // the theme before the first paint; a blocked storage gives the default
      try {
        document.documentElement.dataset.theme = localStorage.getItem("garmin-theme") || "midnight";
      } catch (e) {
        document.documentElement.dataset.theme = "midnight";
      }
    </script>
    <!--style-->
  </head>
  <body>
    <div id="app"></div>
    <script>
      // the server fills these blocks; nothing else in the page changes on an update
      window.GARMIN = {
        data: /* garmin-data:start */ null /* garmin-data:end */,
        layout: /* garmin-layout:start */ null /* garmin-layout:end */,
        widgets: /* garmin-widgets:start */ [] /* garmin-widgets:end */,
        i18n: /* garmin-i18n:start */ {} /* garmin-i18n:end */,
      };
    </script>
    <!--script-->
  </body>
</html>
