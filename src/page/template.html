<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="garmin-template" content="1" />
    <title>Training + Recovery</title>
  </head>
  <body>
    <h1>Training + Recovery</h1>
    <p id="summary"></p>
    <ul id="notes"></ul>
    <script>
      const DATA = /* garmin-data:start */ null; /* garmin-data:end */
      const LAYOUT = /* garmin-layout:start */ null; /* garmin-layout:end */
      const WIDGETS = /* garmin-widgets:start */ []; /* garmin-widgets:end */
      if (DATA) {
        document.getElementById("summary").textContent =
          `${DATA.start} to ${DATA.end}: ${DATA.activities.length} activities`;
        for (const note of DATA.notes ?? []) {
          const li = document.createElement("li");
          li.innerHTML = note; // the server escapes the notes
          document.getElementById("notes").append(li);
        }
      }
    </script>
  </body>
</html>
